  <script>
    "use strict";
    function validation() {
      const firstName = document.getElementById("firstName");
      const lastName = document.getElementById("lastName");
      const email = document.getElementById("email");
      const phone = document.getElementById("phoneNumber");
      const message = document.getElementById("message");

      const firstNameError = document.getElementById("firstNameError");
      const lastNameError = document.getElementById("lastNameError");
      const emailError = document.getElementById("emailError");
      const phoneError = document.getElementById("phoneError");
      const messageError = document.getElementById("messageError");
      const success = document.getElementById("success");

      const nameRegex = /^[a-zA-Z]{2,}$/;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const phoneRegex = /^[0-9]{6,15}$/;
      const messageRegex = /^.{10,}$/;

      let valid = true;

      success.textContent = "";
      [firstName, lastName, email, phone, message].forEach(i => i.classList.remove("invalide"));
      [firstNameError, lastNameError, emailError, phoneError, messageError].forEach(e => e.textContent = "");

      if (!nameRegex.test(firstName.value.trim())) {
        firstName.classList.add("invalide");
        firstNameError.textContent = "Invalid first name";
        valid = false;
      }
      if (!nameRegex.test(lastName.value.trim())) {
        lastName.classList.add("invalide");
        lastNameError.textContent = "Invalid last name";
        valid = false;
      }
      if (!emailRegex.test(email.value.trim())) {
        email.classList.add("invalide");
        emailError.textContent = "Invalid email format";
        valid = false;
      }
      if (!phoneRegex.test(phone.value.trim())) {
        phone.classList.add("invalide");
        phoneError.textContent = "Phone number must have 6–15 digits";
        valid = false;
      }
      if (!messageRegex.test(message.value.trim())) {
        message.classList.add("invalide");
        messageError.textContent = "Message must be at least 10 characters";
        valid = false;
      }
      if (valid) {
        success.textContent = "✅ Message sent successfully!";
        document.querySelector("form").reset();
      }
      return false;
    }
  </script>
